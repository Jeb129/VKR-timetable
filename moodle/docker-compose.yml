services:
  moodle_db:
    image: postgres:14-alpine  # Понижаем версию для совместимости
    container_name: moodle_db
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodleuser
      POSTGRES_PASSWORD: moodlepassword
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodleuser -d moodle"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vkr-shared
  moodle:
    image: bitnamilegacy/moodle:latest
    container_name: moodle
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:8443:8443"
    entrypoint: /bin/bash -c "mkdir -p /bitnami/apache/conf && /opt/bitnami/scripts/moodle/entrypoint.sh /opt/bitnami/scripts/moodle/run.sh"
    environment:
      # Настройки базы данных
      MOODLE_DATABASE_TYPE: pgsql
      MOODLE_DATABASE_HOST: moodle_db
      MOODLE_DATABASE_PORT_NUMBER: 5432
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodleuser
      MOODLE_DATABASE_PASSWORD: moodlepassword
      
      # Настройки администратора
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: a1d2m3i4n5!
      MOODLE_EMAIL: admin@mail.ru
      
      # Дополнительные переменные для legacy образа
      MOODLE_SKIP_BOOTSTRAP: "no"
      MOODLE_SKIP_INSTALL: "no"
      APACHE_HTTP_PORT_NUMBER: 8080
      APACHE_HTTPS_PORT_NUMBER: 8443
      
      # PHP настройки
      PHP_MEMORY_LIMIT: 512M
    depends_on:
      moodle_db:
        condition: service_healthy
    volumes:
      - ./moodle_data:/bitnami/moodle
      - ./moodledata:/bitnami/moodledata
    restart: unless-stopped
    networks:
      - vkr-shared
networks:
  vkr-shared:
    external: true
    name: vkr-network