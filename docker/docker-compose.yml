services:
  backend_db:
    image: postgres:17-alpine
    container_name: vkr-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../backend/pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file: .env

  redis:
    image: redis:7-alpine
    container_name: vkr-redis
    restart: always
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ../redis:/data

  backend:
    image: jeb129/vkr-backend:latest
    container_name: vkr-backend
    restart: always
    depends_on:
      - postgres
      - redis
    env_file: ../backend/.env
    volumes:
      - ../backend/static:/app/static
      - ../backend/media:/app/media
      - ../datafiles:/app/datafiles
      - ../logs:/app/logs
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py makemigrations api &&
             python manage.py makemigrations authentification &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
  frontend:
    image: jeb129/vkr-frontend:latest
    container_name: vkr-frontend
    restart: "no"
    volumes:
      - ../frontend:/output
    command: sh -c "cp -rp /app/dist/. /output/"

networks:
  default:
    external:
      name: vkr 
