name: Сборка и деплой
on:
  push:
    branches: [ "main" ] # Срабатывает при пуше в основную ветку

jobs:
  # 1. Сборка и отправка образа в Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3
      
      - name: Проверка наличия секретов
        run: |
          if [ -z "${{ secrets.DOCKER_HUB_USERNAME }}" ]; then echo "Логин пустой"; else echo "Логин заполнен"; fi
          if [ -z "${{ secrets.DOCKER_HUB_TOKEN }}" ]; then echo "Пароль пустой"; else echo "Пароль заполнен"; fi

      - name: Вход Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Сборка бэкенда
        uses: docker/build-push-action@v4
        with:
          context: ./docker 
          file: ./backend-dockerFile 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vkr-backend:latest
      
      - name: Сборка фронтенда
        uses: docker/build-push-action@v4
        with:
          context: ./docker 
          file: ./frontend-dockerFile 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vkr-frontend:latest 

  # 2. Обновление на сервере
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Запускать только после успешной сборки
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Копируем docker-compose.yml на сервер
      - name: Copy docker-compose via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Укажите путь к вашему compose файлу в репозитории
          source: "docker/docker-compose.yml" 
          target: "~/vkr-deploy/" # Папка на сервере (будет создана)

      # Выполняем команды на сервере через SSH
      - name: Remote Docker Compose Update
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/vkr-deploy/
            
            # Авторизуемся, чтобы стянуть образ (если репозиторий приватный)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Подтягиваем новые образы, указанные в docker-compose.yml
            docker compose pull
            
            # Перезапускаем контейнеры (флаг -d — в фоне)
            # Docker поймет, что образ обновился и пересоздаст только нужные контейнеры
            docker compose up -d
            
            # Опционально: удаляем старые зависшие образы, чтобы не забивать диск
            docker image prune -f
