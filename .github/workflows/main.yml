name: Сборка и деплой
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v4 # Обновил до v4

      - name: Вход в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Сборка Фронтенда с кэшированием
      - name: Сборка и отправка фронтенда
        uses: docker/build-push-action@v5
        with:
          context: . # Контекст - корень репозитория
          file: ./docker/frontend-dockerfile # Путь к файлу
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/vkr-frontend:latest
          cache-from: type=gha # Использовать кэш GitHub Actions
          cache-to: type=gha,mode=max

      # Сборка Бэкенда с кэшированием
      - name: Сборка и отправка бэкенда
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend-dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/vkr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Копирование docker-compose на сервер
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "~/vkr-deploy/"

      - name: Деплой через SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/vkr-deploy/docker
            
            # Логинимся (используем те же секреты, что и выше)
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            
            # Тянем новые образы
            docker-compose pull
            
            # Перезапускаем
            docker-compose up -d
            
            # Очистка старых образов
            docker image prune -f
